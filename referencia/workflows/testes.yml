# Testes dos scripts de indicadores em cada pull request que mexe neles.
name: Testes

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/indicadores.yaml"
      - "config/conjuntura.yaml"
      - "config/projecoes.yaml"
      - "config/panorama.yaml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: O painel é gerado a partir dos dados gravados
        run: python scripts/gerar_painel.py
      - name: O Panorama é gerado a partir do último briefing
        run: python scripts/gerar_panorama.py
