# Panorama Econômico
# Quando o briefing do dia é gravado na main, gera panorama/ultimo.html (PT e EN na mesma página)
# a partir do relatório e dos dados oficiais já coletados. Sem IA, sem rede além do GitHub.
# Para rodar à mão: Actions → Panorama Econômico → Run workflow.
# Usa apenas o GITHUB_TOKEN automático do próprio GitHub.

name: Panorama Econômico

on:
  push:
    branches: [main]
    paths:
      - "relatorios/**/paridade.md"
      - "relatorios/**/relatorio-pt.md"
      - "relatorios/**/relatorio-en.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panorama
  cancel-in-progress: false

jobs:
  panorama:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Gerar o Panorama
        env:
          TZ: America/Sao_Paulo
        run: python scripts/gerar_panorama.py

      - name: Checar escopo e segredos
        run: |
          git add panorama/
          if git status --porcelain | grep -vE '^.. panorama/'; then
            echo "Arquivos fora de panorama/ foram alterados; nada será gravado."; exit 1
          fi
          if git diff --cached | grep -qEi '(ghp_|gho_|github_pat_|sk-[a-z0-9]{20,}|xox[abp]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "SEGREDO_SUSPEITO: nada será gravado."; exit 1
          fi
          echo "SEM_SEGREDOS"

      - name: Gravar e publicar
        run: |
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Panorama $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          for espera in 2 4 8 16; do
            git push origin HEAD:main && exit 0
            sleep "$espera"
            git pull --no-rebase --no-edit origin main
          done
          echo "Push falhou após 4 tentativas."; exit 1
