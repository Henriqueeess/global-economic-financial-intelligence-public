# Glossário de termos financeiros do English Learning Corner
# A execução diária só pode acrescentar datas em "usado_em" e incluir termos novos.
# Expressões usadas nos últimos 20 dias úteis não devem ser repetidas.

termos:
  - termo: Monetary Policy
    definicao: Actions by a central bank to manage interest rates and money supply to reach its inflation and growth goals.
    traducao: Política monetária
    usado_em: ["2026-11-18"]
  - termo: Fiscal Policy
    definicao: Government decisions on spending and taxation.
    traducao: Política fiscal
    usado_em: ["2026-11-18"]
  - termo: Inflation Expectations
    definicao: What households, firms and markets believe inflation will be in the future.
    traducao: Expectativas de inflação
    usado_em: ["2026-11-18"]
  - termo: Interest Rate Differential
    definicao: The gap between interest rates in two countries, which drives currency and capital flows.
    traducao: Diferencial de juros
    usado_em: ["2026-11-18"]
  - termo: Yield Curve
    definicao: A line showing bond yields across maturities, from short-term to long-term.
    traducao: Curva de juros
    usado_em: ["2026-11-18"]
  - termo: Treasury Yields
    definicao: The return investors earn on U.S. government bonds.
    traducao: Rendimento dos Treasuries (títulos do Tesouro americano)
    usado_em: ["2026-11-18"]
  - termo: Risk Appetite
    definicao: Investors' willingness to buy riskier assets.
    traducao: Apetite a risco
    usado_em: ["2026-11-18"]
  - termo: Risk-Off Environment
    definicao: A period when investors sell risky assets and seek safe havens.
    traducao: Ambiente de aversão a risco
    usado_em: ["2026-11-18"]
  - termo: Capital Flows
    definicao: Movements of money across borders for investment.
    traducao: Fluxos de capital
    usado_em: ["2026-11-18"]
  - termo: Emerging Markets
    definicao: Developing economies with growing financial markets, such as Brazil, India or Mexico.
    traducao: Mercados emergentes
    usado_em: ["2026-11-18"]
  - termo: Commodity Prices
    definicao: Prices of raw materials such as oil, iron ore, soybeans and gold.
    traducao: Preços das commodities
    usado_em: ["2026-11-18"]
  - termo: Economic Outlook
    definicao: The expected path of the economy over the coming months or years.
    traducao: Perspectiva econômica
    usado_em: ["2026-11-18"]
  - termo: Market Sentiment
    definicao: The overall mood of investors toward a market or asset.
    traducao: Sentimento de mercado
    usado_em: ["2026-11-18"]
  - termo: Corporate Earnings
    definicao: Profits reported by companies, usually each quarter.
    traducao: Resultados corporativos (lucros das empresas)
    usado_em: ["2026-11-18"]
  - termo: Gross Domestic Product (GDP)
    definicao: The total value of goods and services produced in an economy over a period.
    traducao: Produto Interno Bruto (PIB)
    usado_em: ["2026-11-18"]
  - termo: Hawkish
    definicao: Favouring tighter monetary policy, such as higher interest rates, to fight inflation.
    traducao: Postura dura / contracionista
    usado_em: ["2026-11-19"]
  - termo: Rate Hike
    definicao: An increase in a central bank's policy interest rate.
    traducao: Alta de juros
    usado_em: ["2026-11-19"]
  - termo: Oversubscribed
    definicao: When demand for securities in an offering exceeds the amount available.
    traducao: Demanda superior à oferta (sobresubscrita)
    usado_em: ["2026-11-19"]
  - termo: Currency Depreciation
    definicao: A fall in a currency's value against another currency.
    traducao: Depreciação cambial
    usado_em: ["2026-11-19"]
  - termo: Fiscal Adjustment
    definicao: Measures to improve public finances by cutting spending or raising revenue.
    traducao: Ajuste fiscal
    usado_em: ["2026-11-19"]
  - termo: Bear Market
    definicao: A fall of 20% or more from a recent peak in a market index.
    traducao: Mercado em baixa (bear market)
    usado_em: ["2026-11-20"]
  - termo: FX Intervention
    definicao: When a central bank buys or sells foreign currency to influence the exchange rate.
    traducao: Intervenção cambial
    usado_em: ["2026-11-20"]
  - termo: Sell-off
    definicao: A rapid, broad sale of assets that pushes prices down.
    traducao: Onda de vendas / liquidação
    usado_em: ["2026-11-20"]
  - termo: Public Sector Net Borrowing
    definicao: The gap between what the public sector spends and what it receives in a period.
    traducao: Necessidade de financiamento do setor público
    usado_em: ["2026-11-20"]
  - termo: Offer Price
    definicao: The price at which shares are sold to investors in an initial public offering (IPO).
    traducao: Preço da oferta
    usado_em: ["2026-11-20"]
  - termo: Correction
    definicao: A decline of 10% or more from a recent high in an asset or index.
    traducao: Correção
    usado_em: ["2026-11-21"]
  - termo: Behind the Curve
    definicao: When a central bank reacts too late to inflation or growth trends.
    traducao: Atrás da curva (reagir tarde demais)
    usado_em: ["2026-11-21"]
  - termo: Safe Haven
    definicao: An asset investors buy for protection in times of stress, such as Treasuries or gold.
    traducao: Porto seguro / ativo de proteção
    usado_em: ["2026-11-21"]
  - termo: Carry Trade
    definicao: Borrowing in a low-yielding currency to invest in a higher-yielding one.
    traducao: Operação de carry trade
    usado_em: ["2026-11-21"]
  - termo: Government Shutdown
    definicao: A halt of non-essential federal services when Congress fails to approve funding.
    traducao: Paralisação do governo (shutdown)
    usado_em: ["2026-11-21"]
  - termo: Capital Flight
    definicao: Rapid outflow of money from a country, usually driven by loss of confidence.
    traducao: Fuga de capitais
    usado_em: ["2026-11-22"]
  - termo: Overweight
    definicao: Holding more of an asset or market than its weight in the benchmark.
    traducao: Sobreponderação (overweight)
    usado_em: ["2026-11-22"]
  - termo: Export Controls
    definicao: Government rules that restrict the sale or transfer of sensitive goods or technology abroad.
    traducao: Controles de exportação
    usado_em: ["2026-11-22"]
  - termo: Country Risk
    definicao: The extra yield investors demand to hold a country's debt, reflecting default risk.
    traducao: Risco-país
    usado_em: ["2026-11-22"]
  - termo: Rollover
    definicao: Replacing maturing debt with new debt.
    traducao: Rolagem da dívida
    usado_em: ["2026-11-22"]
  - termo: Deferred Tax Assets (DTAs)
    definicao: Tax credits a company can use to reduce future tax payments, often counted in bank capital within limits.
    traducao: Ativos fiscais diferidos (créditos tributários)
    usado_em: ["2026-11-23"]
  - termo: Collateral
    definicao: Assets pledged to secure a loan, such as bonds a bank delivers to the central bank to borrow.
    traducao: Garantia (colateral)
    usado_em: ["2026-11-23"]
  - termo: Primary Surplus
    definicao: Government revenue minus spending, excluding interest payments, when the result is positive.
    traducao: Superávit primário
    usado_em: ["2026-11-23"]
  - termo: Stress Test
    definicao: A simulation of severe scenarios to check whether firms can absorb losses.
    traducao: Teste de estresse
    usado_em: ["2026-11-23"]
  - termo: Stock Futures
    definicao: Contracts on the future value of a stock index, traded before the cash market opens.
    traducao: Futuros de índices de ações
    usado_em: ["2026-11-23"]
