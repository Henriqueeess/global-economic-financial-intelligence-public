<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conjuntura macro</title>
<!-- Modelo do dashboard. scripts/gerar_dashboard.py troca o marcador de dados pelo JSON do dia.
     Página única: sem bibliotecas externas, sem rede, sem armazenamento. -->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --band: rgba(42,120,214,0.10); --band-line: #898781;
  --cold: #2a78d6; --hot: #e34948; --mid: #f0efec;
  --accent: #0b2545;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a199;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --band: rgba(57,135,229,0.16); --band-line: #898781;
    --cold: #3987e5; --hot: #e66767; --mid: #383835;
    --accent: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a199;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --band: rgba(57,135,229,0.16); --band-line: #898781;
  --cold: #3987e5; --hot: #e66767; --mid: #383835;
  --accent: #9ec5f4;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px; padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; }
.aviso { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--ink-2); font-size: 13.5px; margin-bottom: 20px; }
h2 { font-size: 17px; margin: 28px 0 4px; }
.nota { color: var(--ink-2); font-size: 13.5px; margin: 0 0 12px; }
.calor { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.bloco { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.bloco h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.cel { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 9px; border-radius: 6px; margin-top: 4px; align-items: baseline; }
.cel .n { font-size: 13.5px; }
.cel .v { font-variant-numeric: tabular-nums; font-size: 13.5px; text-align: right; color: var(--ink-2); }
.cel .p { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 15px; text-align: right; }
.cel .d { font-size: 12px; color: var(--ink-2); }
.legenda-calor { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 0; }
.legenda-calor .esc { width: 160px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--cold), var(--mid), var(--hot)); }
.icf { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
.icf b { font-size: 30px; line-height: 1; font-weight: 650; }
.graficos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 10px; position: relative; min-width: 0; }
.card h3 { font-size: 15px; margin: 0; }
.card .nota { font-size: 12.5px; margin: 2px 0 8px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.leg i.tr { border-top-style: dashed; }
.leg i.fx { height: 10px; border: 1px solid var(--band-line); background: var(--band); }
svg.ch { display: block; touch-action: pan-y; }
svg.ch text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.dica { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 2; min-width: 150px; }
.dica .t { color: var(--ink-2); margin-bottom: 3px; }
.dica div { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.dica i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dica b { font-variant-numeric: tabular-nums; font-weight: 600; }
.fontes { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.fontes a { color: var(--ink-2); }
footer { margin-top: 32px; font-size: 13px; color: var(--ink-2); }
footer li { margin: 4px 0; }
@media (max-width: 560px) { h1 { font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="titulo"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="ctrl">
      <div class="seg" id="faixas" role="group"></div>
      <div class="seg" id="idiomas" role="group">
        <button data-l="pt">PT</button><button data-l="en">EN</button>
      </div>
    </div>
  </header>
  <div class="aviso" id="aviso"></div>

  <h2 id="h-termo"></h2>
  <p class="nota" id="n-termo"></p>
  <div class="calor" id="calor"></div>
  <div class="legenda-calor"><span id="leg-0"></span><span class="esc"></span><span id="leg-100"></span></div>
  <div class="icf" id="icf"></div>

  <h2 id="h-graf"></h2>
  <p class="nota" id="n-graf"></p>
  <div class="graficos" id="graficos"></div>

  <footer><ul id="metodo"></ul></footer>
</div>
<script>
const D = /*__DADOS__*/null;
const TXT = {
  pt: {
    titulo: "Conjuntura macro", sub: "Dados oficiais até {d} · gerado em {g}",
    aviso: "Leitura descritiva da conjuntura, feita só com dados oficiais. Foco atual: juros e inflação. Não há projeção de câmbio, de juros de mercado nem de preço de ativos. As linhas tracejadas são contas aritméticas com premissa declarada.",
    hTermo: "Termômetros", nTermo: "Cada indicador em percentil do próprio histórico desde {a}: 0 é o menor valor do período, 100 o maior, 50 a mediana. As cores mostram só a posição no histórico, não se é bom ou ruim.",
    leg0: "0 · menor do período", leg100: "100 · maior do período", haUmAno: "há 1 ano: {p}",
    icf: "Índice de condições financeiras (Brasil)", icfNota: "{q} · {d}. Acima de 50, mais apertadas que a mediana desde {a}.",
    icfQ: ["muito frouxas", "frouxas", "neutras", "apertadas", "muito apertadas"],
    hGraf: "Histórico", nGraf: "Passe o mouse ou o dedo sobre um gráfico para ver os valores. O período vale para todos os gráficos.",
    tudo: "Tudo", anos: "{n} anos", ano: "1 ano", meta: "Meta (centro e tolerância)", fonte: "Fontes",
    metodo: [
      "Fontes: APIs oficiais e gratuitas (BCB, Tesouro Transparente, Tesouro dos EUA, FRED, BCE, Eurostat). Os dados brutos estão em dados/series/ e as contas em dados/conjuntura/, prontos para Power BI.",
      "Séries diárias aparecem com um ponto por semana antes dos dois últimos anos, para a página ficar leve.",
      "Percentil: posição do último valor entre todos os valores da mesma conta desde {a}. Taxas definidas em reunião contam por dia de vigência.",
      "Metas de inflação: resoluções do CMN (meta contínua de 3% desde 2025).",
    ],
  },
  en: {
    titulo: "Macro conditions", sub: "Official data through {d} · generated {g}",
    aviso: "A descriptive reading of macro conditions, built only from official data. Current focus: rates and inflation. There is no forecast of FX, market rates or asset prices. Dashed lines are arithmetic under a stated assumption.",
    hTermo: "Thermometers", nTermo: "Each indicator as a percentile of its own history since {a}: 0 is the lowest value in the period, 100 the highest, 50 the median. Colors show position in history only, not whether it is good or bad.",
    leg0: "0 · lowest in period", leg100: "100 · highest in period", haUmAno: "1 year ago: {p}",
    icf: "Financial conditions index (Brazil)", icfNota: "{q} · {d}. Above 50 means tighter than the median since {a}.",
    icfQ: ["very loose", "loose", "neutral", "tight", "very tight"],
    hGraf: "History", nGraf: "Hover or tap a chart to read values. The period applies to every chart.",
    tudo: "All", anos: "{n} years", ano: "1 year", meta: "Target (midpoint and band)", fonte: "Sources",
    metodo: [
      "Sources: free official APIs (BCB, Tesouro Transparente, US Treasury, FRED, ECB, Eurostat). Raw data is in dados/series/ and the calculations in dados/conjuntura/, ready for Power BI.",
      "Daily series show one point per week before the last two years, to keep the page light.",
      "Percentile: where the latest value sits among all values of the same measure since {a}. Policy rates set at meetings count per day in force.",
      "Inflation targets: CMN resolutions (continuous 3% target since 2025).",
    ],
  },
};
const CORES = ["--s1", "--s2", "--s3", "--s4"];
const MESES = { pt: ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],
                en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] };
const FAIXAS = [365, 1095, 1825, 0];
let lang = "pt", faixa = 1825;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function data(n) { return new Date(n * 864e5); }
function fmtData(n, mensal) {
  const d = data(n), m = MESES[lang][d.getUTCMonth()], y = d.getUTCFullYear();
  if (mensal) return lang === "pt" ? `${m}/${y}` : `${m} ${y}`;
  const dd = String(d.getUTCDate()).padStart(2, "0"), mm = String(d.getUTCMonth() + 1).padStart(2, "0");
  return lang === "pt" ? `${dd}/${mm}/${y}` : `${y}-${mm}-${dd}`;
}
function num(v, dec) {
  return v.toLocaleString(lang === "pt" ? "pt-BR" : "en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }).replace(/^-(?=0([.,]0+)?$)/, "").replace("-", "−");
}
function comUnidade(v, dec, u) {
  if (u === "R$") return `R$ ${num(v, dec)}`;
  if (u === "%") return `${num(v, dec)}%`;
  if (u === "p.p.") return `${num(v, dec)} ${lang === "pt" ? "p.p." : "pp"}`;
  if (u === "% a.a.") return `${num(v, dec)}${lang === "pt" ? "% a.a." : "% p.a."}`;
  return num(v, dec);
}
function f(s, o) { return s.replace(/\{(\w+)\}/g, (_, k) => o[k]); }
function el(tag, attrs, txt) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (txt != null) e.textContent = txt;
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function corPct(p) {
  // diverge do azul (0) ao vermelho (100) passando pelo cinza neutro (50)
  const lado = p < 50 ? "--cold" : "--hot", forca = Math.round(Math.abs(p - 50) / 50 * 62);
  return `color-mix(in oklab, var(${lado}) ${forca}%, var(--mid))`;
}

function textos() {
  const t = TXT[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.getElementById("titulo").textContent = t.titulo;
  document.title = t.titulo;
  document.getElementById("sub").textContent = f(t.sub, { d: fmtData(D.ref), g: D.gerado.replace("T", " ") });
  document.getElementById("aviso").textContent = t.aviso;
  document.getElementById("h-termo").textContent = t.hTermo;
  document.getElementById("n-termo").textContent = f(t.nTermo, { a: D.desde });
  document.getElementById("leg-0").textContent = t.leg0;
  document.getElementById("leg-100").textContent = t.leg100;
  document.getElementById("h-graf").textContent = t.hGraf;
  document.getElementById("n-graf").textContent = t.nGraf;
  const ul = document.getElementById("metodo"); ul.replaceChildren();
  t.metodo.forEach(x => ul.appendChild(el("li", {}, f(x, { a: D.desde }))));
  document.querySelectorAll("#idiomas button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  const fx = document.getElementById("faixas"); fx.replaceChildren();
  FAIXAS.forEach(n => {
    const b = el("button", { "aria-pressed": n === faixa }, n === 0 ? t.tudo : n === 365 ? t.ano : f(t.anos, { n: n / 365 }));
    b.onclick = () => { faixa = n; textos(); graficos(); };
    fx.appendChild(b);
  });
}

function calor() {
  const t = TXT[lang], box = document.getElementById("calor"); box.replaceChildren();
  const blocos = [];
  D.termometros.forEach(x => { const b = x["bloco_" + lang]; if (!blocos.includes(b)) blocos.push(b); });
  blocos.forEach(b => {
    const card = el("div", { class: "bloco" }); card.appendChild(el("h3", {}, b));
    D.termometros.filter(x => x["bloco_" + lang] === b).forEach(x => {
      const c = el("div", { class: "cel" });
      c.style.background = corPct(x.pct);
      c.appendChild(el("span", { class: "n" }, x[lang]));
      c.appendChild(el("span", { class: "p", title: "percentil" }, num(x.pct, 0)));
      c.appendChild(el("span", { class: "d" }, `${comUnidade(x.valor, x.decimais, x.unidade)} · ${fmtData(x.data, x.mensal)}`));
      c.appendChild(el("span", { class: "d", style: "text-align:right" }, x.pct_1a == null ? "" : f(t.haUmAno, { p: num(x.pct_1a, 0) })));
      card.appendChild(c);
    });
    box.appendChild(card);
  });
  const icf = document.getElementById("icf"); icf.replaceChildren();
  if (D.icf) {
    icf.appendChild(el("b", {}, num(D.icf[1], 0)));
    const d = el("div");
    d.appendChild(el("div", { style: "font-weight:600" }, t.icf));
    d.appendChild(el("div", { class: "nota", style: "margin:0" },
      f(t.icfNota, { q: t.icfQ[Math.min(4, Math.floor(D.icf[1] / 20))], d: fmtData(D.icf[0]), a: D.desde })));
    icf.appendChild(d);
  } else icf.remove();
}

function graficos() {
  const box = document.getElementById("graficos"); box.replaceChildren();
  D.graficos.forEach(g => { const card = el("div", { class: "card" }); box.appendChild(card); grafico(g, card); });
}

function grafico(g, card) {
  const t = TXT[lang];
  card.appendChild(el("h3", {}, g["titulo_" + lang]));
  card.appendChild(el("p", { class: "nota" }, g["nota_" + lang]));
  const leg = el("div", { class: "leg" });
  g.linhas.forEach((l, i) => {
    const s = el("span"), m = el("i", { class: l.tracejado ? "tr" : "" });
    m.style.borderColor = `var(${CORES[i]})`; s.appendChild(m); s.appendChild(document.createTextNode(l[lang])); leg.appendChild(s);
  });
  if (g.meta) { const s = el("span"); s.appendChild(el("i", { class: "fx" })); s.appendChild(document.createTextNode(t.meta)); leg.appendChild(s); }
  if (g.linhas.length > 1 || g.meta) card.appendChild(leg);

  const fim = Math.max(...g.linhas.map(l => l.pts.length ? l.pts[l.pts.length - 1][0] : 0), D.ref);
  const ini = faixa ? D.ref - faixa : Math.min(...g.linhas.map(l => l.pts.length ? l.pts[0][0] : D.ref));
  const linhas = g.linhas.map(l => ({ ...l, v: l.pts.filter(p => p[0] >= ini && p[0] <= fim) }));
  let lo = Infinity, hi = -Infinity;
  linhas.forEach(l => l.v.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }));
  const metas = (g.meta || []).filter(m => m[1] >= ini && m[0] <= fim);
  metas.forEach(m => { lo = Math.min(lo, m[2] - m[3]); hi = Math.max(hi, m[2] + m[3]); });
  if (g.referencia != null) { lo = Math.min(lo, 0); hi = Math.max(hi, 100); }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  if (g.referencia != null) { lo = 0; hi = 100; }

  const W = Math.max(280, card.clientWidth - 28), H = W < 420 ? 210 : 240, ml = 46, mr = 10, mt = 8, mb = 22;
  const x = d => ml + (d - ini) / Math.max(1, fim - ini) * (W - ml - mr);
  const y = v => mt + (hi - v) / (hi - lo) * (H - mt - mb);
  const svg = sv("svg", { class: "ch", viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": g["titulo_" + lang] });

  const passo = (() => { const r = (hi - lo) / 4, p = Math.pow(10, Math.floor(Math.log10(r))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= r); })();
  for (let v = Math.ceil(lo / passo) * passo; v <= hi; v += passo) {
    svg.appendChild(sv("line", { x1: ml, x2: W - mr, y1: y(v), y2: y(v), stroke: css("--grid"), "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
    const tx = sv("text", { x: ml - 6, y: y(v) + 4, "text-anchor": "end" }); tx.textContent = num(v, passo < 1 ? (passo < 0.1 ? 2 : 1) : 0); svg.appendChild(tx);
  }
  const anoIni = data(ini).getUTCFullYear(), anoFim = data(fim).getUTCFullYear();
  const pulo = Math.max(1, Math.ceil((anoFim - anoIni + 1) / 6));
  if (anoFim - anoIni >= 2) {
    for (let a = anoIni + 1; a <= anoFim; a += pulo) {
      const d = Date.UTC(a, 0, 1) / 864e5, tx = sv("text", { x: x(d), y: H - 6, "text-anchor": "middle" }); tx.textContent = a; svg.appendChild(tx);
    }
  } else {
    for (let k = 0; k <= 4; k++) {
      const d = ini + (fim - ini) * k / 4, tx = sv("text", { x: x(d), y: H - 6, "text-anchor": k === 0 ? "start" : k === 4 ? "end" : "middle" });
      tx.textContent = fmtData(Math.round(d), true); svg.appendChild(tx);
    }
  }
  svg.appendChild(sv("line", { x1: ml, x2: W - mr, y1: H - mb, y2: H - mb, stroke: css("--axis"), "vector-effect": "non-scaling-stroke" }));

  metas.forEach(m => {
    const a = x(Math.max(m[0], ini)), b = x(Math.min(m[1], fim));
    svg.appendChild(sv("rect", { x: a, width: Math.max(0, b - a), y: y(m[2] + m[3]), height: y(m[2] - m[3]) - y(m[2] + m[3]), fill: css("--band") }));
    svg.appendChild(sv("line", { x1: a, x2: b, y1: y(m[2]), y2: y(m[2]), stroke: css("--band-line"), "stroke-dasharray": "2 3", "vector-effect": "non-scaling-stroke" }));
  });
  if (g.referencia != null)
    svg.appendChild(sv("line", { x1: ml, x2: W - mr, y1: y(g.referencia), y2: y(g.referencia), stroke: css("--band-line"), "stroke-dasharray": "2 3", "vector-effect": "non-scaling-stroke" }));

  linhas.forEach((l, i) => {
    if (l.v.length < 2) return;
    // buracos de mais de 45 dias na série ficam em branco, sem ligar os pontos
    const dd = l.v.map((p, k) => `${k && p[0] - l.v[k - 1][0] <= 45 ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    svg.appendChild(sv("path", { d: dd, fill: "none", stroke: css(CORES[i]), "stroke-width": 2, "stroke-linejoin": "round",
      "stroke-dasharray": l.tracejado ? "5 4" : "none", "vector-effect": "non-scaling-stroke" }));
  });

  const cruz = sv("line", { y1: mt, y2: H - mb, stroke: css("--axis"), "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  svg.appendChild(cruz);
  const pontos = linhas.map((l, i) => { const c = sv("circle", { r: 4, fill: css(CORES[i]), stroke: css("--surface"), "stroke-width": 2, visibility: "hidden" }); svg.appendChild(c); return c; });
  card.appendChild(svg);
  const dica = el("div", { class: "dica" }); card.appendChild(dica);

  function mover(ev) {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    if (px < ml || px > W - mr) return sair();
    const d = ini + (px - ml) / (W - ml - mr) * (fim - ini);
    cruz.setAttribute("x1", px); cruz.setAttribute("x2", px); cruz.setAttribute("visibility", "visible");
    dica.replaceChildren(el("div", { class: "t" }, fmtData(Math.round(d), g.id === "inflacao" || g.id === "global_inflacao")));
    let algum = false;
    linhas.forEach((l, i) => {
      let best = null;
      for (const p of l.v) { if (p[0] <= d + 0.5) best = p; else break; }
      if (!best || d - best[0] > 45) { pontos[i].setAttribute("visibility", "hidden"); return; }
      algum = true;
      pontos[i].setAttribute("cx", x(best[0])); pontos[i].setAttribute("cy", y(best[1])); pontos[i].setAttribute("visibility", "visible");
      const row = el("div"), nm = el("span"), bol = el("i"); bol.style.background = `var(${CORES[i]})`;
      nm.appendChild(bol); nm.appendChild(document.createTextNode(l[lang])); row.appendChild(nm);
      row.appendChild(el("b", {}, comUnidade(best[1], g.decimais, g.unidade))); dica.appendChild(row);
    });
    if (!algum) return sair();
    dica.style.display = "block";
    const cx = ev.clientX - card.getBoundingClientRect().left, cw = card.clientWidth, dw = dica.offsetWidth;
    dica.style.left = Math.min(Math.max(4, cx + 12 + dw > cw ? cx - dw - 12 : cx + 12), cw - dw - 4) + "px";
    dica.style.top = (r.top - card.getBoundingClientRect().top + 8) + "px";
  }
  function sair() { cruz.setAttribute("visibility", "hidden"); pontos.forEach(p => p.setAttribute("visibility", "hidden")); dica.style.display = "none"; }
  svg.addEventListener("pointermove", mover); svg.addEventListener("pointerdown", mover); svg.addEventListener("pointerleave", sair);

  const fontes = g.linhas.filter(l => l.fonte);
  if (fontes.length || g.meta_fonte) {
    const fp = el("div", { class: "fontes" }); fp.appendChild(document.createTextNode(t.fonte + ": "));
    fontes.forEach((l, i) => { if (i) fp.appendChild(document.createTextNode(" · ")); fp.appendChild(el("a", { href: l.fonte, target: "_blank", rel: "noopener" }, l[lang])); });
    if (g.meta_fonte) { if (fontes.length) fp.appendChild(document.createTextNode(" · ")); fp.appendChild(el("a", { href: g.meta_fonte, target: "_blank", rel: "noopener" }, t.meta)); }
    card.appendChild(fp);
  }
}

document.querySelectorAll("#idiomas button").forEach(b => b.onclick = () => { lang = b.dataset.l; tudo(); });
try { const q = new URLSearchParams(location.search).get("ed"); if (q === "en") lang = "en"; } catch (e) {}
function tudo() { textos(); calor(); graficos(); }
if (D) tudo();
let tm; addEventListener("resize", () => { clearTimeout(tm); tm = setTimeout(graficos, 150); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { calor(); graficos(); });
</script>
